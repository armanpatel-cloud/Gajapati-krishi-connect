<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, doc, setDoc, getDoc, deleteDoc, query, orderBy, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ========== 1. PASTE YOUR FIREBASE CONFIG HERE ========== */
const firebaseConfig = {
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE_PROJECT.firebaseapp.com",
  projectId: "PASTE_PROJECT_ID",
  storageBucket: "PASTE_PROJECT.appspot.com",
  messagingSenderId: "PASTE_SENDER_ID",
  appId: "PASTE_APP_ID"
};
/* ======================================================== */

const configured = !firebaseConfig.apiKey.startsWith("PASTE");
let auth, db;

if (configured) { 
  const app = initializeApp(firebaseConfig); 
  auth = getAuth(app); 
  db = getFirestore(app); 
} else {
  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("cfgBanner")?.classList.remove("hidden");
  });
}

const BLOCKS = ["Gumma","Rayagada","R. Udayagiri","Nuagada","Mohana","Kashinagar","Gosani"];
const CROPS = ["Paddy","Maize","Ragi","Turmeric","Ginger","Cashew","Mango","Tomato","Brinjal","Chilli","Groundnut","Pulses","Other"];
const FERT = { // N:P2O5:K2O kg per hectare
  "Paddy":[80,40,40], "Maize":[120,60,40], "Ragi":[60,30,30], "Turmeric":[120,60,120],
  "Ginger":[75,50,50], "Tomato":[120,60,60], "Brinjal":[100,50,50], "Chilli":[100,50,50],
  "Groundnut":[20,40,40], "Mustard":[80,40,40], "Wheat":[120,60,40]
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- i18n ---------- */
const I18N = {
  en: { tagline:"Farmers • Experts • Market", nav_home:"Home", nav_market:"Market", nav_ask:"Ask Expert", nav_weather:"Weather", nav_calc:"Calculators", nav_contact:"Contact",
    login:"Login", logout:"Logout", hero_title:"Digital agriculture for Gajapati district",
    hero_sub:"Sell your produce directly, ask agriculture experts, check live weather and use farming calculators.",
    stat_listings:"Products listed", stat_questions:"Questions asked", stat_answers:"Expert answers",
    sell_title:"List your product", sell_btn:"Publish listing", sell_hint:"Login as a Farmer to list your products.",
    ask_btn:"Post question", ask_hint:"Login to ask a question.", send:"Send message" },
  or: { tagline:"କୃଷକ • ବିଶେଷଜ୍ଞ • ବଜାର", nav_home:"ମୂଳପୃଷ୍ଠା", nav_market:"ବଜାର", nav_ask:"ପ୍ରଶ୍ନ ପଚାରନ୍ତୁ", nav_weather:"ପାଣିପାଗ", nav_calc:"ଗଣକ", nav_contact:"ଯୋଗାଯୋଗ",
    login:"ଲଗଇନ୍", logout:"ଲଗଆଉଟ୍", hero_title:"ଗଜପତି ଜିଲ୍ଲା ପାଇଁ ଡିଜିଟାଲ୍ କୃଷି",
    hero_sub:"ସିଧାସଳଖ ଆପଣଙ୍କ ଫସଲ ବିକ୍ରି କରନ୍ତୁ, କୃଷି ବିଶେଷଜ୍ଞଙ୍କୁ ପଚାରନ୍ତୁ, ପାଣିପାଗ ଦେଖନ୍ତୁ ଓ ଗଣକ ବ୍ୟବହାର କରନ୍ତୁ।",
    stat_listings:"ତାଲିକାଭୁକ୍ତ ସାମଗ୍ରୀ", stat_questions:"ପଚରା ଯାଇଥିବା ପ୍ରଶ୍ନ", stat_answers:"ବିଶେଷଜ୍ଞ ଉତ୍ତର",
    sell_title:"ଆପଣଙ୍କ ସାମଗ୍ରୀ ଯୋଡ଼ନ୍ତୁ", sell_btn:"ପ୍ରକାଶ କରନ୍ତୁ", sell_hint:"ସାମଗ୍ରୀ ଯୋଡ଼ିବାକୁ କୃଷକ ଭାବେ ଲଗଇନ୍ କରନ୍ତୁ।",
    ask_btn:"ପ୍ରଶ୍ନ ପୋଷ୍ଟ କରନ୍ତୁ", ask_hint:"ପ୍ରଶ୍ନ ପଚାରିବାକୁ ଲଗଇନ୍ କରନ୍ତୁ।", send:"ବାର୍ତ୍ତା ପଠାନ୍ତୁ" }
};
let lang = localStorage.getItem("lang") || "en";

function applyLang() {
  document.querySelectorAll("[data-i18n]").forEach(el => { const k = el.dataset.i18n; if (I18N[lang][k]) el.textContent = I18N[lang][k]; });
  if ($("langBtn")) $("langBtn").textContent = lang === "en" ? "ଓଡ଼ିଆ" : "English";
  document.documentElement.lang = lang === "en" ? "en" : "or";
  if ($("authBtn")) $("authBtn").textContent = auth?.currentUser ? I18N[lang].logout : I18N[lang].login;
}

/* ---------- navigation ---------- */
window.go = function (v) {
  document.querySelectorAll(".view").forEach(s => s.classList.add("hidden"));
  const target = $("view-" + v);
  if (target) target.classList.remove("hidden");
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("nav-active", b.dataset.view === v));
  if (v === "weather") loadWeather();
  location.hash = v;
};

document.addEventListener("DOMContentLoaded", () => {
  // Bind navigation buttons
  document.querySelectorAll("#nav button").forEach(b => {
    b.onclick = () => go(b.dataset.view);
  });

  // Fill selects
  fill("marketFilter", BLOCKS, true); 
  fill("sellBlock", BLOCKS); 
  fill("askBlock", BLOCKS);
  fill("askCrop", CROPS); 
  fill("fCrop", Object.keys(FERT));

  // Language toggle
  if ($("langBtn")) {
    $("langBtn").onclick = () => { 
      lang = lang === "en" ? "or" : "en"; 
      localStorage.setItem("lang", lang); 
      applyLang(); 
    };
  }

  // Auth button click
  if ($("authBtn")) {
    $("authBtn").onclick = async () => {
      if (!configured) return alert("Add your Firebase config first (see README).");
      if (auth.currentUser) { await signOut(auth); } else { openAuth(); }
    };
  }

  // Auth switch link
  if ($("authSwitch")) {
    $("authSwitch").onclick = () => setMode(mode === "login" ? "signup" : "login");
  }

  // Auth form submit
  if ($("authForm")) {
    $("authForm").onsubmit = async e => {
      e.preventDefault(); 
      if ($("authErr")) $("authErr").textContent = "";
      const f = new FormData(e.target), email = f.get("email"), pass = f.get("password");
      try {
        if (!configured) throw new Error("Firebase not configured.");
        if (mode === "signup") {
          signingUp = true;
          const cred = await createUserWithEmailAndPassword(auth, email, pass);
          await setDoc(doc(db, "users", cred.user.uid), { name: f.get("name").trim(), role: f.get("role"), email, createdAt: serverTimestamp() });
          signingUp = false;
          await handleUser(auth.currentUser);
        } else {
          await signInWithEmailAndPassword(auth, email, pass);
        }
        closeAuth(); 
        e.target.reset();
      } catch (err) { 
        signingUp = false; 
        if ($("authErr")) $("authErr").textContent = err.message.replace("Firebase: ", ""); 
      }
    };
  }

  // Sell form
  if ($("sellForm")) {
    $("sellForm").onsubmit = async e => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      try {
        await addDoc(collection(db, "listings"), { name: f.name.trim(), price: +f.price, unit: f.unit, qty: +f.qty, block: f.block, phone: f.phone,
          uid: auth.currentUser.uid, sellerName: profile?.name || "Farmer", createdAt: serverTimestamp() });
        e.target.reset();
      } catch (err) { alert("Could not publish: " + err.message); }
    };
  }

  if ($("marketFilter")) {
    $("marketFilter").onchange = renderListings;
  }

  if ($("askForm")) {
    $("askForm").onsubmit = async e => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      try {
        await addDoc(collection(db, "questions"), { crop: f.crop, block: f.block, text: f.text.trim(), uid: auth.currentUser.uid, name: profile?.name || "Farmer", createdAt: serverTimestamp() });
        e.target.reset();
      } catch (err) { alert("Could not post: " + err.message); }
    };
  }

  if ($("contactForm")) {
    $("contactForm").onsubmit = async e => {
      e.preventDefault();
      if (!configured) return alert("Add your Firebase config first.");
      const f = Object.fromEntries(new FormData(e.target));
      try { 
        await addDoc(collection(db, "messages"), { name: f.name.trim(), contact: f.phone.trim(), text: f.text.trim(), createdAt: serverTimestamp() });
        if ($("contactMsg")) $("contactMsg").textContent = "✓ Message saved to the database. Thank you!"; 
        e.target.reset(); 
      }
      catch (err) { if ($("contactMsg")) $("contactMsg").textContent = "Error: " + err.message; }
    };
  }

  applyLang();
  go(location.hash.replace("#", "") || "home");

  // Firebase listeners
  if (configured && auth && db) {
    onSnapshot(query(collection(db, "listings"), orderBy("createdAt", "desc")), s => { listings = s.docs.map(d => ({ id: d.id, ...d.data() })); renderListings(); }, err => console.error(err));
    onSnapshot(query(collection(db, "questions"), orderBy("createdAt", "desc")), s => { questions = s.docs.map(d => ({ id: d.id, ...d.data() })); renderQuestions(); }, err => console.error(err));
    onSnapshot(query(collection(db, "replies"), orderBy("createdAt", "asc")), s => { replies = s.docs.map(d => ({ id: d.id, ...d.data() })); renderQuestions(); }, err => console.error(err));
    onAuthStateChanged(auth, user => { if (!signingUp) handleUser(user); });
  }
});

/* ---------- helper functions ---------- */
function fill(id, arr, withAll) {
  const el = $(id);
  if (el) el.innerHTML = (withAll ? `<option value="">All blocks</option>` : "") + arr.map(x => `<option>${esc(x)}</option>`).join("");
}

let mode = "login", profile = null;
function openAuth() { if ($("authModal")) $("authModal").classList.remove("hidden"); setMode("login"); }
window.closeAuth = () => { if ($("authModal")) $("authModal").classList.add("hidden"); if ($("authErr")) $("authErr").textContent = ""; };

function setMode(m) {
  mode = m;
  const signup = m === "signup";
  if ($("authName")) {
    $("authName").classList.toggle("hidden", !signup); 
    $("authName").required = signup;
  }
  if ($("authRole")) $("authRole").classList.toggle("hidden", !signup);
  if ($("authTitle")) $("authTitle").textContent = signup ? "Create account" : "Login";
  if ($("authSubmit")) $("authSubmit").textContent = signup ? "Sign up" : "Login";
  if ($("authSwitch")) $("authSwitch").textContent = signup ? "Already have an account? Login" : "Create new account";
}

let signingUp = false;

async function handleUser(user) {
  profile = null;
  if (user) {
    try { 
      const s = await getDoc(doc(db, "users", user.uid)); 
      profile = s.exists() ? s.data() : { name: user.email, role: "farmer" }; 
    } catch { 
      profile = { name: user.email, role: "farmer" }; 
    }
    if ($("userBox")) {
      $("userBox").textContent = `${profile.name} (${profile.role})`; 
      $("userBox").classList.remove("hidden");
    }
  } else { 
    if ($("userBox")) $("userBox").classList.add("hidden"); 
  }
  if ($("sellBox")) $("sellBox").classList.toggle("hidden", !(user && profile?.role === "farmer"));
  if ($("sellHint")) $("sellHint").classList.toggle("hidden", !!(user && profile?.role === "farmer"));
  if ($("askBox")) $("askBox").classList.toggle("hidden", !user);
  if ($("askHint")) $("askHint").classList.toggle("hidden", !!user);
  applyLang(); renderListings(); renderQuestions();
}

/* ---------- market ---------- */
let listings = [];
function renderListings() {
  const filterEl = $("marketFilter");
  const f = filterEl ? filterEl.value : "";
  const rows = listings.filter(l => !f || l.block === f);
  if ($("statListings")) $("statListings").textContent = listings.length;
  
  const listEl = $("listings");
  if (listEl) {
    listEl.innerHTML = rows.length ? rows.map(l => {
      const mine = auth?.currentUser && (auth.currentUser.uid === l.uid || profile?.role === "officer");
      return `<div class="card">
        <div class="flex justify-between"><h4 class="font-bold text-lg">${esc(l.name)}</h4><span class="text-xs bg-green-100 text-green-800 rounded px-2 py-1">${esc(l.block)}</span></div>
        <div class="text-green-700 font-semibold text-xl mt-1">₹${esc(l.price)} / ${esc(l.unit)}</div>
        <div class="text-sm text-gray-600">Available: ${esc(l.qty)} ${esc(l.unit)}</div>
        <div class="text-sm text-gray-600">Seller: ${esc(l.sellerName)}</div>
        <div class="flex gap-2 mt-3 flex-wrap">
          <a class="btn-o text-sm" href="tel:${esc(l.phone)}">📞 Call</a>
          <a class="btn-o text-sm" target="_blank" rel="noopener" href="https://wa.me/91${esc(l.phone)}?text=${encodeURIComponent("Hello, I saw your " + l.name + " listing on Gajapati Krushi Connect")}">WhatsApp</a>
          ${mine ? `<button class="text-red-600 text-sm underline" data-del="${esc(l.id)}">Delete</button>` : ""}
        </div></div>`;
    }).join("") : `<p class="text-gray-500">No listings yet.</p>`;
    
    listEl.querySelectorAll("[data-del]").forEach(b => {
      b.onclick = async () => { if (confirm("Delete this listing?")) await deleteDoc(doc(db, "listings", b.dataset.del)); };
    });
  }
}

/* ---------- ask expert ---------- */
let questions = [], replies = [];
function renderQuestions() {
  if ($("statQuestions")) $("statQuestions").textContent = questions.length; 
  if ($("statAnswers")) $("statAnswers").textContent = replies.length;
  const isOfficer = profile?.role === "officer";
  
  const qEl = $("questions");
  if (qEl) {
    qEl.innerHTML = questions.length ? questions.map(q => {
      const rs = replies.filter(r => r.qid === q.id);
      const canDel = auth?.currentUser && (auth.currentUser.uid === q.uid || isOfficer);
      return `<div class="card">
        <div class="flex justify-between flex-wrap gap-1 text-xs text-gray-500"><span>${esc(q.name)} • ${esc(q.block)} • <b>${esc(q.crop)}</b></span>
          ${canDel ? `<button class="text-red-600 underline" data-dq="${esc(q.id)}">Delete</button>` : ""}</div>
        <p class="mt-2">${esc(q.text)}</p>
        <div class="mt-3 space-y-2">${rs.map(r => `<div class="bg-green-50 border-l-4 border-green-600 p-2 rounded text-sm"><b>🧑‍🔬 ${esc(r.name)}:</b> ${esc(r.text)}</div>`).join("") || `<div class="text-xs text-gray-400">No answer yet</div>`}</div>
        ${isOfficer ? `<form class="flex gap-2 mt-3" data-reply="${esc(q.id)}"><input class="inp" placeholder="Write expert answer" required maxlength="600"><button class="btn">Reply</button></form>` : ""}
      </div>`;
    }).join("") : `<p class="text-gray-500">No questions yet. Be the first to ask!</p>`;

    qEl.querySelectorAll("[data-dq]").forEach(b => {
      b.onclick = async () => { if (confirm("Delete question?")) await deleteDoc(doc(db, "questions", b.dataset.dq)); };
    });
    qEl.querySelectorAll("[data-reply]").forEach(f => {
      f.onsubmit = async e => {
        e.preventDefault();
        try { 
          await addDoc(collection(db, "replies"), { qid: f.dataset.reply, text: f.querySelector("input").value.trim(), name: profile.name, uid: auth.currentUser.uid, createdAt: serverTimestamp() }); 
        } catch (err) { alert("Could not reply: " + err.message); }
      };
    });
  }
}

/* ---------- weather ---------- */
let weatherHTML = null;
async function loadWeather() {
  if (weatherHTML) {
    if ($("weatherBox")) $("weatherBox").innerHTML = weatherHTML;
    if ($("homeWeather")) $("homeWeather").innerHTML = weatherHTML;
    return;
  }
  try {
    const url = "https://api.open-meteo.com/v1/forecast?latitude=18.78&longitude=84.09&current=temperature_2m,relative_humidity_2m,wind_speed_10m,precipitation&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=Asia%2FKolkata&forecast_days=5";
    const d = await (await fetch(url)).json(), c = d.current;
    weatherHTML = `<div class="text-sm text-gray-500">Paralakhemundi, Gajapati • live</div>
      <div class="text-4xl font-bold text-green-700 my-1">${c.temperature_2m}°C</div>
      <div class="text-sm">Humidity ${c.relative_humidity_2m}% • Wind ${c.wind_speed_10m} km/h • Rain now ${c.precipitation} mm</div>
      <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 mt-4">${d.daily.time.map((t, i) => `
        <div class="bg-green-50 rounded-lg p-2 text-center text-sm"><div class="font-semibold">${new Date(t).toLocaleDateString("en-IN", { weekday: "short", day: "numeric" })}</div>
        <div>${Math.round(d.daily.temperature_2m_max[i])}° / ${Math.round(d.daily.temperature_2m_min[i])}°</div>
        <div class="text-blue-700">🌧 ${d.daily.precipitation_sum[i]} mm</div></div>`).join("")}</div>`;
  } catch { weatherHTML = "Could not load weather. Check internet."; }
  if ($("weatherBox")) $("weatherBox").innerHTML = weatherHTML; 
  if ($("homeWeather")) $("homeWeather").innerHTML = weatherHTML;
}

/* ---------- calculators ---------- */
window.calcFert = () => {
  const cropVal = $("fCrop")?.value;
  const areaVal = $("fArea")?.value;
  if (!cropVal || !FERT[cropVal]) return;
  const [n, p, k] = FERT[cropVal], acres = parseFloat(areaVal);
  if (!(acres > 0)) return $("fOut").textContent = "Enter area in acres.";
  const ha = acres * 0.404686;
  const N = n * ha, P = p * ha, K = k * ha;
  const dap = P / 0.46, nFromDap = dap * 0.18, urea = Math.max(0, N - nFromDap) / 0.46, mop = K / 0.60;
  if ($("fOut")) {
    $("fOut").innerHTML = `<b>Nutrients:</b> N ${N.toFixed(1)} kg, P₂O₅ ${P.toFixed(1)} kg, K₂O ${K.toFixed(1)} kg<br>
      <b>Urea:</b> ${urea.toFixed(1)} kg<br><b>DAP:</b> ${dap.toFixed(1)} kg<br><b>MOP:</b> ${mop.toFixed(1)} kg`;
  }
};

window.calcArea = () => {
  const v = parseFloat($("aVal")?.value), u = parseFloat($("aUnit")?.value);
  if (!(v > 0)) return $("aOut").textContent = "Enter a value.";
  const acres = v / u;
  if ($("aOut")) {
    $("aOut").innerHTML = `${acres.toFixed(3)} acre<br>${(acres * 0.404686).toFixed(3)} hectare<br>${(acres * 100).toFixed(1)} decimal<br>${(acres * 43560).toFixed(0)} sq ft`;
  }
};

window.calcProfit = () => {
  const y = +$("pYield")?.value, p = +$("pPrice")?.value, c = +$("pCost")?.value;
  const rev = y * p, prof = rev - c;
  if ($("pOut")) {
    $("pOut").innerHTML = `Revenue: ₹${rev.toLocaleString("en-IN")}<br>Profit: <b class="${prof >= 0 ? "text-green-700" : "text-red-600"}">₹${prof.toLocaleString("en-IN")}</b>`;
  }
};
</script>
